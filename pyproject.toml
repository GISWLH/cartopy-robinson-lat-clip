[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "robinson-lat-clip"
version = "0.1.0"
description = "Clip a Cartopy Robinson globe south of a latitude without cutting the ellipse into a rectangle."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "GISWLH" }]
keywords = ["cartopy", "robinson", "map", "antarctica", "clip"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = [
    "cartopy>=0.21",
    "matplotlib>=3.7",
    "numpy>=1.24",
    "shapely>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.urls]
Homepage = "https://github.com/GISWLH/cartopy-robinson-lat-clip"
Issues = "https://github.com/GISWLH/cartopy-robinson-lat-clip/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    "ignore::UserWarning",
]
